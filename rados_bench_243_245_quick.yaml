# CBT RADOS Bench 快速测试配置
# Ceph 集群节点: 10.103.11.244, 245, 246
# 访问方式: RADOS 直接访问 (最底层)

common:
  pdsh_ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

cluster:
  user: 'ceph'
  head: "10.103.11.244"
  clients: ["10.103.11.249"]
  osds: ["10.103.11.244", "10.103.11.245", "10.103.11.243"]
  mons:
    10.103.11.244:
      a: "10.103.11.244:6789"
    10.103.11.245:
      b: "10.103.11.245:6789"
    10.103.11.243:
      c: "10.103.11.243:6789"
  
  use_existing: True
  conf_file: '/etc/ceph/ceph.conf'
  tmp_dir: "/tmp/cbt"
  iterations: 1
  
  ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  
  # Ceph 命令路径
  rados_cmd: '/usr/bin/rados'
  ceph_cmd: '/usr/bin/ceph'
  
  # 存储池配置（适合小容量 OSD）
  pool_profiles:
    rados_test:
      pg_size: 16
      pgp_size: 16
      replication: 3

# 性能监控配置 - 收集 CPU cycles & instructions
monitoring_profiles:
  perf:
    nodes: ['clients']
    args: 'stat -e cycles,instructions,cache-references,cache-misses,branch-instructions,branch-misses -a -o {perf_dir}/perf_stat.$$ sleep 999999'

benchmarks:
  radosbench:
    # 存储池配置
    pool_profile: 'rados_test'
    
    # RADOS bench 参数
    # write 4K / seq(read) 4K / write 1M / seq(read) 1M
    # radosbench 每次运行先写后读（write + seq），op_size 控制块大小
    op_size: [4096, 1048576]            # 4K + 1M
    time: 60                            # 测试时长（秒）
    concurrent_ops: [32]                # 并发操作数（统一 32）
    concurrent_procs: 1
    
    # 测试模式
    write_only: False                   # False 表示先写后读（write + seq）
    
    # 使用现有存储池
    use_existing: True
    
    # 清理选项
    cleanup: True                       # 测试后清理数据
