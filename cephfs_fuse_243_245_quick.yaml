# CBT CephFS FUSE 快速测试配置
#
# 测试拓扑:
#   客户端 (10.103.11.249) --[ceph-fuse]--> MDS (10.103.11.243) --> OSD x3
#
# 测试用例（共 2 个）:
#   Case 1  randwrite  4K  iodepth=4   - 随机写
#   Case 2  randread   4K  iodepth=4   - 随机读

common:
  pdsh_ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

cluster:
  user: 'ceph'
  head: "10.103.11.244"
  clients: ["10.103.11.249"]
  osds: ["10.103.11.244", "10.103.11.245", "10.103.11.243"]
  mons:
    10.103.11.244:
      a: "10.103.11.244:6789"
    10.103.11.245:
      b: "10.103.11.245:6789"
    10.103.11.243:
      c: "10.103.11.243:6789"

  mdss: ["10.103.11.243"]

  use_existing: True
  conf_file: '/etc/ceph/ceph.conf'
  tmp_dir: "/tmp/cbt"
  iterations: 1
  ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  fs: 'cephfs'

monitoring_profiles:
  perf:
    nodes: ['clients']
    pid_dir: '/run'
    pid_glob: 'cbt_perf_marker.pid'
    args: 'stat -e cycles,instructions,cache-references,cache-misses,branch-instructions,branch-misses -a -o {perf_dir}/perf_stat.$$ sleep 999999'

client_endpoints:
  cephfs_test:
    driver: 'cephfs-fuse'
    endpoints_per_client: 1
    endpoint_size: 262144

benchmarks:
  fio:
    client_endpoints: 'cephfs_test'
    cmd_path: '/usr/bin/fio'

    time: 60
    time_based: True
    ramp: 5

    size: 512                   # 512 MB（CBT 单位: MB）
    norandommap: True

    # randwrite 4K / randread 4K / write(seq) 1M / read(seq) 1M
    mode: ['randwrite', 'randread', 'write', 'read']
    op_size: [4096, 1048576]    # 4K + 1M
    iodepth: [4]
    procs_per_endpoint: [1]

    fio_out_format: 'json,normal'
    log_avg_msec: 100
    log_iops: True
    log_bw: True
    log_lat: True
