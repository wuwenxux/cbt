# CBT RBD NBD 快速测试配置
# Ceph 集群节点: 10.103.11.244, 245, 246
# 访问方式: Network Block Device (rbd-nbd)

common:
  pdsh_ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

cluster:
  user: 'ceph'
  head: "10.103.11.244"
  clients: ["10.103.11.249"]
  osds: ["10.103.11.244", "10.103.11.245", "10.103.11.243"]
  mons:
    10.103.11.244:
      a: "10.103.11.244:6789"
    10.103.11.245:
      b: "10.103.11.245:6789"
    10.103.11.243:
      c: "10.103.11.243:6789"
  
  use_existing: True
  conf_file: '/etc/ceph/ceph.conf'
  tmp_dir: "/tmp/cbt"
  iterations: 1
  
  ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  
  # Ceph 命令路径
  rbd_cmd: '/usr/bin/rbd'
  ceph_cmd: '/usr/bin/ceph'
  rados_cmd: '/usr/bin/rados'
  
  # 存储池配置（适合小容量 OSD）
  pool_profiles:
    rbd:
      pg_size: 16
      pgp_size: 16
      replication: 3

# 性能监控配置 - 收集 CPU cycles & instructions
monitoring_profiles:
  perf:
    nodes: ['clients']
    args: 'stat -e cycles,instructions,cache-references,cache-misses,branch-instructions,branch-misses -a -o {perf_dir}/perf_stat.$$ sleep 999999'

# 客户端端点配置 - 使用 RBD NBD
client_endpoints:
  rbd_nbd_test:
    driver: 'rbd-nbd'              # 使用 rbd-nbd 驱动
    endpoints_per_client: 1        # 每个客户端1个端点
    endpoint_size: 4096            # 端点大小（MB）= 4 GB；同时作为 fio.py 的 KB 校验上限
    pool_profile: 'rbd'            # 使用上面定义的存储池配置

benchmarks:
  fio:
    # 引用客户端端点配置
    client_endpoints: 'rbd_nbd_test'
    
    cmd_path: '/usr/bin/fio'
    
    # 测试时长
    time: 60
    time_based: True
    ramp: 5
    
    # IO配置 - 4 标准测试场景
    # randwrite 4K / randread 4K / write(seq) 1M / read(seq) 1M
    mode: ['randwrite', 'randread', 'write', 'read']
    op_size: [4096, 1048576]       # 4K + 1M
    iodepth: [32]
    procs_per_endpoint: [1]
    numjobs: [1]
    
    # 输出配置
    fio_out_format: 'json,normal'
    log_avg_msec: 100
    log_iops: True
    log_bw: True
    log_lat: True
