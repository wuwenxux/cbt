# CBT RBD KRBD (Kernel RBD) 快速测试配置
# Ceph 集群节点: 10.103.11.243, 244, 245
# 访问方式: Kernel RBD Module (/dev/rbdX)

common:
  pdsh_ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

cluster:
  user: 'ceph'
  head: "10.103.11.244"
  clients: ["10.103.11.249"]
  osds: ["10.103.11.244", "10.103.11.245", "10.103.11.243"]
  mons:
    10.103.11.244:
      a: "10.103.11.244:6789"
    10.103.11.245:
      b: "10.103.11.245:6789"
    10.103.11.243:
      c: "10.103.11.243:6789"
  
  use_existing: True
  conf_file: '/etc/ceph/ceph.conf'
  tmp_dir: "/tmp/cbt"
  # pid_dir 指向客户端标记文件所在目录，供 perf 监控使用
  # 需预先在客户端执行: echo 1 | sudo tee /run/cbt_perf_marker.pid
  pid_dir: "/run"
  iterations: 1
  
  ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  
  # Ceph 命令路径
  rbd_cmd: '/usr/bin/rbd'
  ceph_cmd: '/usr/bin/ceph'
  
  # 存储池配置（适合小容量 OSD）
  pool_profiles:
    rbd:
      pg_size: 4
      pgp_size: 4
      replication: 3

# 性能监控配置 - 收集客户端 CPU cycles & instructions
# nodes: ['clients'] 在客户端节点采集
# -a 全系统采样，不绑定具体进程
# 前置条件：客户端需预先创建标记文件：
#   ssh ceph@10.103.11.249 "echo 1 | sudo tee /run/cbt_perf_marker.pid"
monitoring_profiles:
  perf:
    nodes: ['clients']
    pid_dir: '/run'
    pid_glob: 'cbt_perf_marker.pid'
    args: 'stat -e cycles,instructions,cache-references,cache-misses,branch-instructions,branch-misses -a -o {perf_dir}/perf_stat.$$ sleep 999999'

benchmarks:
  rbdfio:
    # FIO 命令路径
    cmd_path: '/usr/bin/fio'
    
    # 存储池配置
    pool_profile: 'rbd'
    poolname: 'krbd_test_pool'
    
    # RBD 映射配置
    # KRBD 会将 RBD image 映射为 /dev/rbdX 设备
    rbd_map: True
    
    # 卷配置
    vol_size: 1024               # 卷大小（MB）= 1GB
    volumes_per_client: 1        # 每个客户端的卷数
    use_existing_volumes: False  # 自动创建新卷
    # rbdname 将由CBT自动生成
    
    # 测试时长
    time: 60                     # 测试时长（秒）= 1分钟
    time_based: True             # 基于时间运行
    ramp: 5                      # 预热时间（秒）
    
    # IO配置 - 4 标准测试场景
    # randwrite 4K / randread 4K / write(seq) 1M / read(seq) 1M
    mode: ['randwrite', 'randread', 'write', 'read']
    iodepth: [32]
    numjobs: [1]
    op_size: [4096, 1048576]     # 4K + 1M
    
    # 进程配置
    procs_per_client: 1          # 每个客户端的进程数
    
    # 输出配置
    fio_out_format: 'json,normal'  # 输出格式
    log_avg_msec: 100            # 日志平均时间间隔（毫秒）
    log_iops: True               # 记录IOPS
    log_bw: True                 # 记录带宽
    log_lat: True                # 记录延迟
